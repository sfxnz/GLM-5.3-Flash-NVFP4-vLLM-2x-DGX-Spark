# Source of truth for the values that repeat across run.sh, README.md and CI.
# Edit here, then `python3 kit/render.py`. CI runs `python3 kit/render.py --check`.
# Every scalar is used as the string you typed (0.80 stays 0.80). `null` means none.
# `&name` anchors a value; `*name` reuses it, so a pinned value is written once.

model:
  id: &model nvidia/GLM-5.3-Flash-NVFP4
  revision: &revision 09b04e5e74bca08ca8549fc736d4cdd8624bfde3
  served_name: *model
  family: GLM-5.3-Flash
  params: 320B total / 18B active
  quant: NVFP4 W4A4 on routed experts and dense MLP (ModelOpt 0.47.0, nvfp4_experts_dense_mlp-kv_fp8_cast). Attn, shared experts, and vision stay BF16. KV scheme is kv_fp8_cast.
  draft: incoai/GLM-5.3-Flash-DFlash2
  # Newer DFlash2 revisions have the same config.json (weights-only updates):
  # bf582e4eacc1810f76656d1811693ff6c6737d2a (2026-08-31), dc77ff1c99eeb2df044ee3d4f0094eb033fee410 (2026-08-28).
  # E1b: bf582e4 moved no acceptance against 7d74cdd, so the default stays; DRAFT_REV=<full sha> picks one.
  draft_revision: &draft_revision 7d74cdd881ed7e32c31175984a67823127b66cfe

image:
  base: vllm/vllm-openai:glm53-flash-arm64-cu130
  digest: null
  local_tag: &image glm53-sm121-v14
  build: docker/Dockerfile.sm121-v8 -> v9 -> v10 -> v11 -> v13 -> v14

engine:
  name: vllm
  version: null

hardware:
  shape: 2x DGX Spark (GB10)
  nnodes: &nnodes 2
  tp: &tp 2

serve:
  # The `# BEGIN generated` block of run.sh, in run.sh order. Each key renders as NAME="${NAME:-value}".
  env:
    MODEL: *model
    SERVED_NAME: $MODEL
    IMAGE: *image
    CONTAINER_NAME: glm53-flash-nvfp4
    PORT: 8000
    MASTER_PORT: 29521
    HEAD_IP: 10.100.8.1
    WORKER_HOST: spark2
    IFACE: enp1s0f1np1
    HCA: rocep1s0f1,roceP2p1s0f1        # r2 B1: both RoCE rails (one rail: rocep1s0f1)
    TP: *tp
    NNODES: *nnodes
    MAX_MODEL_LEN: 327680
    MAX_NUM_SEQS: 2
    UTIL: 0.85
    KV_CACHE_DTYPE: fp8_e4m3
    NUM_SPECULATIVE_TOKENS: 7
    MAX_NUM_BATCHED_TOKENS: 4624         # r2 B2: 4608-token prefill chunks (2048 floors to 1152)
    FORCE_UNSAFE_CTX: 0
    FORCE_UNSAFE_MOE: 0
    FORCE_UNSAFE_LINEAR: 0
    FORCE_UNSAFE_SPEC: 0
    FORCE_UNSAFE_VISION: 0
    FORCE_UNSAFE_IMAGE: 0
    LANGUAGE_MODEL_ONLY: 0
    MM_PROCESSOR_CACHE_GB: 1
    MAX_NEW_TOKENS: 65536
    VLLM_USE_BREAKABLE_CUDAGRAPH: ""
    CHAT_TEMPLATE: $SCRIPT_DIR/chat_template.jinja
    KV_CACHE_MEMORY: 4445787956
    BLOCK_SIZE: 2304
    HF_CACHE: $HOME/.cache/huggingface
    SNAPSHOT_REV: *revision
    MOE_BACKEND: marlin
    LINEAR_BACKEND: marlin
    REASONING_PARSER: glm45
    DRAFT_MODEL: incoai/GLM-5.3-Flash-DFlash2
    DRAFT_REV: *draft_revision
    SPEC: dflash2
    JIT_CACHE: 1
    JIT_CACHE_DIR: $HOME/projects/data/glm53-jit-cache
    # v13 switches (docker/README-v13.md). run.sh turns them into GLM53_* env on both ranks.
    # v11 rollback: IMAGE=glm53-sm121-v11 DRAFT_WEIGHTS=bf16 TARGET_WEIGHT_GROUPS_INT8=none KPOOL_TAIL_FIX=0 ADAPTIVE_VERIFY=0.
    DRAFT_WEIGHTS: nvfp4                 # E2e
    TARGET_WEIGHT_GROUPS_INT8: shared,mla,kda_o,kda_in,lm_head  # E4a
    PREFILL_DEQUANT_MIN_M: 512           # r2 B3 (E6 reverted it at 1152-row chunks)
    KPOOL_TAIL_FIX: 1                    # E3a
    ADAPTIVE_VERIFY: 1                   # E3b
    ADAPTIVE_VERIFY_TAU: 0.4             # r2 B5 (E4b 0.3; r2 B7 0.5 plateaus)
    # v14 switches (docker/README-v14.md), need a glm53-sm121-v14 image.
    DECODE_FIXES: 1                      # r2 B4

readme:
  # Rows of the README "Defaults" table. {NAME} is replaced by serve.env.NAME.
  defaults:
    - Image: "`{IMAGE}` (local; chain v8 → v9 → v10 → v11 → v13 → v14, see Build the image for the rollbacks)"
    - Model: "`{MODEL}` (served under `SERVED_NAME`, which defaults to `$MODEL`)"
    - "`--tensor-parallel-size` / `--nnodes`": "{TP} / {NNODES}"
    - "`--max-model-len`": "{MAX_MODEL_LEN}"
    - "`--max-num-seqs`": "{MAX_NUM_SEQS}"
    - "`--max-num-batched-tokens`": "{MAX_NUM_BATCHED_TOKENS}: prefill chunks end on the 1152-token mamba-align block, so vLLM's 2048 gave 1152-token chunks that each stream every routed expert once; 4624 gives 4608-token chunks (+16 leaves room for two decoding requests). r2 B2: prefill +13.7% / +14.5% at 32k / 128k, decode flat; the fp8 pool is 360,448 tokens (372,877 at 2048), still 1.10x of 327680"
    - NCCL rails: "`NCCL_IB_HCA={HCA}`: both RoCE rails (GB10's CX-7 splits each port over two PCIe functions; the other two HCAs are DOWN). Cross-node all-reduce of a 9 / 18 MiB prefill activation: 1085 / 1725 µs on one rail, 720 / 905 µs on two; 64 KiB decode messages unchanged. r2 B1: prefill +3.3% / +2.1%, decode flat. `HCA=rocep1s0f1` is the one-rail rollback"
    - "`--kv-cache-dtype`": "`{KV_CACHE_DTYPE}`"
    - "`--kv-cache-memory`": "`{KV_CACHE_MEMORY}` (4.14 GiB)"
    - "`--moe-backend`": "`{MOE_BACKEND}`, routed experts only (`run.sh` refuses `flashinfer_cutlass`; it OOM'd spark2)"
    - "`--linear-backend`": "`{LINEAR_BACKEND}`, dense quantized linears (the nvidia pack's layer 0-2 MLP is NVFP4; `run.sh` refuses other values, whose NVFP4 GEMMs JIT on sm_121)"
    - Checkpoint: "`{SNAPSHOT_REV}` (official NVIDIA ModelOpt 0.47.0; `MODEL=LibertAIDAI/GLM-5.3-Flash-NVFP4 SNAPSHOT_REV=caca4e6a4ebbd66f159d3d2fc256683fd6e27177` rolls back)"
    - Vision: "on (`LANGUAGE_MODEL_ONLY={LANGUAGE_MODEL_ONLY}`; the pack is `Glm5NextForConditionalGeneration` with `vision_config`)"
    - "`--mm-processor-cache-gb`": "{MM_PROCESSOR_CACHE_GB} (vLLM default is 4; caps processed image/video tensors cached in the head's EngineCore on UMA)"
    - Output ceiling: "`--override-generation-config '{\"max_new_tokens\": {MAX_NEW_TOKENS}}'` (clamps every request; `generation_config.json` T=1.0 / top_p 0.95 still apply; `MAX_NEW_TOKENS=0` drops the flag)"
    - "`--block-size`": "{BLOCK_SIZE}"
    - CUDA graphs: "on, capture ladder 1/2/4 + ({NUM_SPECULATIVE_TOKENS}+1) x 1..{MAX_NUM_SEQS} (`ENFORCE_EAGER=1` reverts to `--enforce-eager`)"
    - Speculative: "DFlash2-{NUM_SPECULATIVE_TOKENS} (`NUM_SPECULATIVE_TOKENS=5 MAX_NUM_SEQS=4` for four-way; MTP-4 rollback is the LibertAI pack plus `SPEC=mtp ADAPTIVE_VERIFY=0`)"
    - Draft: "`{DRAFT_MODEL}` @ `{DRAFT_REV}` (`DRAFT_REV=<full sha>` overrides; see DFlash2 drafter)"
    - Drafter weights: "`DRAFT_WEIGHTS={DRAFT_WEIGHTS}`: the DFlash2 linears in NVFP4 W4A16 (`GLM53_NVFP4_W4A16=draft`). The target verifies every draft, so output is unchanged. E2e: step A −4 ms, Tier 0 nll and greedy at the A/A, Tier 1 856 vs 857 of 1010. `bf16` turns it off"
    - Target INT8: "`TARGET_WEIGHT_GROUPS_INT8=\"{TARGET_WEIGHT_GROUPS_INT8}\"`: comma list of target groups (`shared`, `mla`, `kda_o`, `kda_in`, `lm_head`) in INT8 W8A16 (`GLM53_INT8_W8A16`); `draft` is refused. `none` keeps them BF16 (an empty value falls back to the default). FP8 and NVFP4 on target groups failed Tier 0 on KL (E2a-E2d). INT8 g128 on all five (E4a vs E3b): step A −17 ms, prose A +24.9%, code B +21.1%, structured J +17.6%; Tier 0 at the cross-boot A/A; Tier 1 863 vs 857 of 1010"
    - Prefill dequant: "`PREFILL_DEQUANT_MIN_M={PREFILL_DEQUANT_MIN_M}`: a prefill input of at least this many rows dequantizes the swapped `kda_in` weight to BF16 and runs cuBLAS instead of Marlin (`GLM53_WQ_DEQUANT_MIN_M`, `GLM53_WQ_DEQUANT_GROUPS=kda_in`); `run.sh` refuses 1-63, so captured decode and verify steps (16 rows or fewer) keep Marlin. INT8 Marlin re-streams `kda_in` from DRAM once per 64-row block, so its cost grows with the chunk while the dequant is paid once per chunk. E6 at 1152-row chunks: +6.4% / +3.5% at 32k / 128k (reverted). r2 B3 at 4608-row chunks: +13.8% at both 32k and 128k, decode flat. `0` turns it off"
    - Indexer tail ring: "`KPOOL_TAIL_FIX={KPOOL_TAIL_FIX}` (`GLM53_KPOOL_TAIL_FIX`): a per-request DSA indexer tail ring sized for the verify window, so rejected drafts and the other request no longer write committed pool keys (this matters above 2048 tokens). E3a: needles 3/3 at 8k, 32k and 128k; decode-built pools match prefill within the prefill A/A; step time within noise. `0` keeps v11's ring"
    - Adaptive verify: "`ADAPTIVE_VERIFY={ADAPTIVE_VERIFY}`, `ADAPTIVE_VERIFY_TAU={ADAPTIVE_VERIFY_TAU}` (`GLM53_ADAPTIVE_VERIFY`, `_TAU`): verify only the leading drafts whose running DFlash2 confidence stays at or above tau, at fixed shapes (lossless). E3b vs E3a (tau 0.2): prose A +14.9%, H +20.0%, code B +5.3%, thinking T +10.1%, structured J flat; Tier 0 nll and greedy at the A/A. E4b tau 0.3 vs 0.2: A +5.2%, H +8.0%, B +4.3%, T +2.1%. r2 B5 tau 0.4 vs 0.3: A +4.2%, H +4.9%, B +3.3%; r2 B7 tau 0.5 plateaued (A -0.5%, B -0.9%). Needs `SPEC=dflash2`; `0` turns it off"
    - Decode fixes: "`DECODE_FIXES={DECODE_FIXES}` (v14, `docker/README-v14.md`): `GLM53_ROUTER_DEDUPE=1` skips the model-side MoE router GEMM that the MoE runner recomputes and overwrites (42 GEMMs per step, exact), and `GLM53_HEADGATE_MM=1` runs the DSA indexer head-gate as one bf16 GEMM with fp32 output instead of an fp32 gemv (same products, fp32 accumulation; M=8 41 → 21 µs, M=4608 1135 → 166 µs). r2 B4: step A 73.5 → 72.8 ms, inside single-boot noise. `0` runs v13's code and is required on a v13 image"
    - Chat template: "`chat_template.jinja` (honors `enable_thinking` and its `thinking` alias, the glm45 parser's rule)"
    - JIT / compile cache: "on (`JIT_CACHE={JIT_CACHE}`), `{JIT_CACHE_DIR}/<image id>/` per node, mounted at `/jit-cache`; `JIT_CACHE=0` disables"
    - Reasoning / tools: "`{REASONING_PARSER}` / `glm47`"
    - API: "`http://<head>:{PORT}/v1`"

measured:
  # Published decode score is prose only. Do not add structured or code rows.
  # Each value: per boot, the mean of its two panels (bench-1 --full, bench-2 fast gate); then the mean of the three
  # boots. tok/s, step_ms and acceptance_len are the bench's means (what kit/compare.py compares); TTFT is the panel p50.
  decode:
    conditions: "prose only, ruler v2 (bench_decode.py). c=1 is cell A: 8 distinct prose prompts, 512 forced tokens, greedy, thinking off. c=2 is cell H: the same prompts as 4 waves of two distinct streams (prefix-cache hits, so its TTFT is not comparable to A's). Three boots of plain ./run.sh on 2026-10-16 (R1, R2, R3), one fast-gate panel each: image glm53-sm121-v14 9599a9fc5fe5, DFlash2-7 drafter 7d74cdd with NVFP4 W4A16 weights, INT8 W8A16 g128 target groups shared,mla,kda_o,kda_in,lm_head, adaptive verify at tau 0.4, kpool tail fix, DECODE_FIXES=1, PREFILL_DEQUANT_MIN_M=512, max-num-batched-tokens 4624, both RoCE rails, fp8_e4m3 KV pinned at 4.14 GiB, context 327680, max-num-seqs 2, CUDA graphs, warm JIT cache. kit/compare.py against the previous defaults (F1, F2b, G2 of 2026-09-28): A +4.0% [+3.2,+4.8] KEEP, H +3.8% [+1.7,+5.8] KEEP, step A -5.3% (evidence/r2/compare-r123-vs-f12g2.txt). Prefill (cell E) 1593 / 1562 tok/s at 32k / 128k against 1187 / 1183: +34.3% / +32.0% (evidence/r2/prefill-table.txt)."
    units: {decode: tok/s per stream (mean), aggregate: tok/s (mean), ttft_p50: s, step_ms: ms per decode step (mean), acceptance_len: tokens per step (mean)}
    rows:
      - {phase: prose, concurrency: 1, decode: 31.23, aggregate: 31.23, ttft_p50: 0.27, step_ms: 69.3, acceptance_len: 2.17, evidence: [evidence/r2/r1, evidence/r2/r2, evidence/r2/r3]}
      - {phase: prose, concurrency: 2, decode: 21.46, aggregate: 40.50, ttft_p50: 0.39, step_ms: 99.7, acceptance_len: 2.14, evidence: [evidence/r2/r1, evidence/r2/r2, evidence/r2/r3]}

links:
