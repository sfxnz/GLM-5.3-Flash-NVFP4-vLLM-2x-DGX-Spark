# Source of truth for the values that repeat across run.sh, README.md and CI.
# Edit here, then `python3 kit/render.py`. CI runs `python3 kit/render.py --check`.
# Every scalar is used as the string you typed (0.80 stays 0.80). `null` means none.
# `&name` anchors a value; `*name` reuses it, so a pinned value is written once.

model:
  id: &model LibertAIDAI/GLM-5.3-Flash-NVFP4
  revision: &revision caca4e6a4ebbd66f159d3d2fc256683fd6e27177
  served_name: &served_name LibertAIDAI/GLM-5.3-Flash-NVFP4
  family: GLM-5.3-Flash
  params: 320B total / 18B active
  quant: NVFP4 (weight-only, routed experts)
  draft: incoai/GLM-5.3-Flash-DFlash2 @ 7d74cdd881ed7e32c31175984a67823127b66cfe

image:
  base: vllm/vllm-openai:glm53-flash-arm64-cu130
  digest: null
  local_tag: &image glm53-sm121-v11
  build: docker/Dockerfile.sm121-v8 -> v9 -> v10 -> v11

engine:
  name: vllm
  version: null

hardware:
  shape: 2x DGX Spark (GB10)
  nnodes: &nnodes 2
  tp: &tp 2

serve:
  # The `# BEGIN generated` block of run.sh, in run.sh order. Each key renders as NAME="${NAME:-value}".
  env:
    MODEL: *model
    SERVED_NAME: *served_name
    IMAGE: *image
    CONTAINER_NAME: glm53-flash-nvfp4
    PORT: 8000
    MASTER_PORT: 29521
    HEAD_IP: 10.100.8.1
    WORKER_HOST: spark2
    IFACE: enp1s0f1np1
    HCA: rocep1s0f1
    TP: *tp
    NNODES: *nnodes
    MAX_MODEL_LEN: 327680
    MAX_NUM_SEQS: 2
    UTIL: 0.85
    KV_CACHE_DTYPE: fp8_e4m3
    NUM_SPECULATIVE_TOKENS: 7
    MAX_NUM_BATCHED_TOKENS: ""
    FORCE_UNSAFE_CTX: 0
    FORCE_UNSAFE_MOE: 0
    VLLM_USE_BREAKABLE_CUDAGRAPH: ""
    CHAT_TEMPLATE: $SCRIPT_DIR/chat_template.jinja
    KV_CACHE_MEMORY: 4445787956
    BLOCK_SIZE: 2304
    HF_CACHE: $HOME/.cache/huggingface
    SNAPSHOT_REV: *revision
    MOE_BACKEND: marlin
    REASONING_PARSER: glm45
    DRAFT_MODEL: incoai/GLM-5.3-Flash-DFlash2
    SPEC: dflash2

readme:
  # Rows of the README "Defaults" table. {NAME} is replaced by serve.env.NAME.
  defaults:
    - Image: "`{IMAGE}` (local)"
    - Model: "`{MODEL}`"
    - "`--tensor-parallel-size` / `--nnodes`": "{TP} / {NNODES}"
    - "`--max-model-len`": "{MAX_MODEL_LEN}"
    - "`--max-num-seqs`": "{MAX_NUM_SEQS}"
    - "`--kv-cache-dtype`": "`{KV_CACHE_DTYPE}`"
    - "`--kv-cache-memory`": "`{KV_CACHE_MEMORY}` (4.14 GiB)"
    - "`--moe-backend`": "`{MOE_BACKEND}` (`run.sh` refuses `flashinfer_cutlass`; it OOM'd spark2)"
    - Checkpoint: "`{SNAPSHOT_REV}` (calibrated MoE `input_scale`; `SNAPSHOT_REV=aa28e1f54130286c95fee10d0705c74ce8743734` rolls back)"
    - "`--block-size`": "{BLOCK_SIZE}"
    - CUDA graphs: "on, capture ladder 1/2/4 + 8/16 (`ENFORCE_EAGER=1` reverts to `--enforce-eager`)"
    - Speculative: "DFlash2-{NUM_SPECULATIVE_TOKENS} (`NUM_SPECULATIVE_TOKENS=5 MAX_NUM_SEQS=4` for four-way; `SPEC=mtp` for MTP-4)"
    - Chat template: "`chat_template.jinja` (honors `enable_thinking`)"
    - Reasoning / tools: "`{REASONING_PARSER}` / `glm47`"
    - API: "`http://<head>:{PORT}/v1`"

measured:
  # The README decode table. One row per (phase, concurrency); a row's three numbers come from one
  # bench_decode.py run. evidence: the file under evidence/ that contains them, or null while there is none.
  decode:
    conditions: streamed greedy, thinking off, 200 completion tokens, 3-run median; max-num-seqs=2, fp8 KV pinned at 4.14 GiB, context 327680, DFlash2-7, CUDA graphs
    units: {decode: tok/s per stream (median), aggregate: tok/s, ttft_p50: s}
    rows:
      - {phase: prose, concurrency: 1, decode: 21.2, aggregate: 21.2, ttft_p50: 0.33, evidence: evidence/rebench-20260902T204243Z/bench.txt}
      - {phase: prose, concurrency: 2, decode: 16.6, aggregate: 33.2, ttft_p50: 0.37, evidence: evidence/rebench-20260902T204243Z/bench.txt}

links:
  model: https://huggingface.co/LibertAIDAI/GLM-5.3-Flash-NVFP4
  draft: https://huggingface.co/incoai/GLM-5.3-Flash-DFlash2
  repo: https://github.com/sfxnz/GLM-5.3-Flash-NVFP4-vLLM-2x-DGX-Spark

bench:
  # kit/bench_decode.py: URL is http://127.0.0.1:{PORT}/v1/chat/completions, model is model.served_name.
  # chat_template_kwargs turn thinking off for this model; every kit probe sends the same kwargs.
  chat_template_kwargs: {enable_thinking: false}

probes:
  # kit/probes/run-all.sh runs these in order. A bare name has no params; {name: params} passes them.
  - smoke
  - count
  - thinking_off
  - tool_call
  - hermes_two_turn
  - needle: [8192, {tokens: 20480, concurrency: 2}]

lint:
  # kit/recipe_lint.py: the recipe-specific expectations. Generic checks live in the script.
  required_files:
    - chat_template.jinja
    - docker/Dockerfile.sm121-v8
    - docker/Dockerfile.sm121-v9
    - docker/Dockerfile.sm121-v10
    - docker/Dockerfile.sm121-v11
    - docker/dflash2_backport.diff
    - docker/patch_v10_dflash_glm5.py
    - docker/patch_v11_dflash_kv_groups.py
  contains:
    README.md:
      - Recipe scripts are MIT
      - CC BY-NC-ND
      - docker build -f docker/Dockerfile.sm121-v8
      - docker build -f docker/Dockerfile.sm121-v9
      - docker build -f docker/Dockerfile.sm121-v10
      - docker build -f docker/Dockerfile.sm121-v11
      - ./run.sh
      - ./stop.sh
      - python3 kit/bench_decode.py
      - http://127.0.0.1:8000/v1/chat/completions
      - SPEC=mtp
      - LibertAIDAI/GLM-5.3-Flash-NVFP4
      - glm53-sm121-v11
      - Say hello in one sentence.
      - enable_thinking
      - "`marlin`"
      - "`glm45`"
    run.sh:
      - '--moe-backend "$MOE_BACKEND"'
      - '--reasoning-parser "$REASONING_PARSER"'
      - 'if [[ -d "$SNAPSHOT" ]]; then'
      - Do not use stock vllm/vllm-openai on sm_121
      - FORCE_UNSAFE_CTX
      - cannot hold --max-model-len
      - $NUM_SPECULATIVE_TOKENS
      - '"method":"dflash"'
    chat_template.jinja:
      - enable_thinking | default(true)
      - "{{- '<think></think>' -}}"
  forbids:
    run.sh:
      - VLLM_GLM53_MOE_INPUT_SCALE   # 1.0 underflows per-block fp8 scales
  readme_mentions_env: [IMAGE, PORT, MAX_MODEL_LEN, MAX_NUM_SEQS, KV_CACHE_MEMORY, BLOCK_SIZE, SPEC, SERVED_NAME, CONTAINER_NAME, NUM_SPECULATIVE_TOKENS, KV_CACHE_DTYPE]
  dockerfile_from:
    docker/Dockerfile.sm121-v8: vllm/vllm-openai:glm53-flash-arm64-cu130
    docker/Dockerfile.sm121-v9: glm53-sm121-v8
    docker/Dockerfile.sm121-v10: glm53-sm121-v9
    docker/Dockerfile.sm121-v11: glm53-sm121-v10
  expect_cases:
    # dflash2 CUDA-graph ladder: 1/2/4 plus (spec+1)x{1..MAX_NUM_SEQS}
    - {env: {}, expect: '"cudagraph_capture_sizes":[1,2,4,8,16]'}
    - {env: {NUM_SPECULATIVE_TOKENS: "5", MAX_NUM_SEQS: "4"}, expect: '"cudagraph_capture_sizes":[1,2,4,6,12,18,24]'}
  refuse_cases:
    - {env: {MAX_MODEL_LEN: "1048576"}, expect: cannot hold --max-model-len}
    - {env: {KV_CACHE_MEMORY: "3221225472"}, expect: 3.62 GiB}
    - {env: {KV_CACHE_MEMORY: "3886945403"}, expect: "327168"}
    - {env: {MOE_BACKEND: flashinfer_cutlass}, expect: Stay on marlin}
